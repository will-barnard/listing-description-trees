services:
  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - listing-trees-backend
    networks:
      - internal

  listing-trees-backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: listing_trees
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_token}
      NODE_ENV: production
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: listing_trees
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    name: listing-trees-internal

volumes:
  postgres-data:
    name: listing-trees-postgres
