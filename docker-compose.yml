services:
  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: listing_trees
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-brew_token}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: listing_trees
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
    name: listing-trees-postgres
